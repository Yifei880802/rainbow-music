services:
  rainbow:
    # image 引用由 scripts/build-fpk.sh 渲染：CI 注入 FPK_IMAGE_DIGEST 时钉成
    # <image>:<tag>@<digest>（digest 决定实际拉取，tag 仅供本地 docker images 阅读），
    # 本地打包没有 registry digest，渲染为纯 <image>:<tag>。
    # 渲染时组合占位必须先于单独占位替换，顺序调换会让 digest pin 静默失效。
    image: __FPK_IMAGE__:__FPK_IMAGE_TAG__
    container_name: rainbow
    restart: unless-stopped
    # v0.2.6：manifest service_port=0 后 fnOS 注入的 TRIM_SERVICE_PORT 不再可靠
    # （很可能为 0 或缺失），端口固定字面量映射 23330：宿主 LAN 直连入口
    # http://<NAS_IP>:23330/ 保留；网关流量走 Unix Socket，不经本端口
    ports:
      - "23330:23330"
    environment:
      TZ: Asia/Shanghai
      RO_SERVER_HOST: 0.0.0.0
      # v0.2.6：同上，RO_SERVER_PORT 固定 23330（env 优先于 config.yaml，
      # 向导已不再提供端口项，服务监听恒为 23330）
      RO_SERVER_PORT: "23330"
      RO_DB_DIR: /app/data/db
      # 统一网关：服务监听该 Unix Socket，fnOS 校验用户会话后经 /app/com.rainbow.music 前缀转发
      # 并注入 X-Trim-Userid/X-Trim-Username/X-Trim-Isadmin 身份头（WebSocket 同前缀复用）
      # v0.2.5：socket 命名对齐 fygo/官方示例的 app.sock；fnOS 网关保留完整前缀转发，
      # 应用侧由服务端 rewriteUrl 前缀重写适配（前缀转发语义实测：GET /app/myapp/list
      # 原样到达应用 socket）
      RO_GATEWAY_SOCK: /app/target/app.sock
      # fnOS 渲染 compose 时注入应用运行身份（数字 uid/gid）；服务端 listen 后据此
      # chown socket 属主（网关以应用身份连接 socket）。缺省为空则服务端跳过 chown（fail-safe）
      TRIM_RUN_UID: "${TRIM_RUN_UID}"
      TRIM_RUN_GID: "${TRIM_RUN_GID}"
      # 本地音乐库扫描根（":" 分隔）：默认含共享下载目录，向导配置的扫描目录由生命周期脚本
      # 渲染追加为 /app/data/scan/1、/app/data/scan/2 ...（渲染函数按行前缀整行替换本行）。
      # v0.2.2：不再使用 __XXX__ 形式占位符——fnOS 升级流程会移除该命名空间的内容
      # （含 env 行与注释锚点），改用默认值直写，向导有值时仍由 sed 整行替换
      RO_SCAN_ROOTS: "/app/data/downloads"
    volumes:
      # 配置文件：由 install_callback 从安装向导渲染，落在飞牛托管的 etc 目录
      - ${TRIM_PKGETC}/config.yaml:/app/config.yaml
      # 下载目录（v0.2.15）：挂载 fnOS 托管的 data-share 共享目录 rainbow-music
      # （fpk/config/resource 已声明），下载文件可直接在飞牛文件管理器查看。
      # 源用卷号无关的稳定软链 /var/apps/com.rainbow.music/shares/rainbow-music
      # （fnOS 维护，→ @appshare/rainbow-music），不硬编码 /volN。容器内路径恒为
      # /app/data/downloads；config.yaml 的 download.dir 保持相对值 data/downloads 不变。
      # 本行必须留在包内 compose 模板——fnOS 从内部保存的模板运行，回调期动态渲染的
      # 挂载行不会被采用（见 docs/FNOS-DEPLOY.md）。
      - /var/apps/com.rainbow.music/shares/rainbow-music:/app/data/downloads
      # 音源脚本目录（lx-music .js 音源）
      - ${TRIM_PKGVAR}/data/sources:/app/data/sources
      # SQLite 数据库目录（任务记录/歌单），升级不丢数据
      - ${TRIM_PKGVAR}/data/db:/app/data/db
      # 统一网关 socket 目录：fnOS 将宿主机 ${TRIM_APPDEST} 挂进容器，网关转发
      # /app/com.rainbow.music -> 该目录下的 app.sock（ui/config 的 gatewaySocket 与之对应）
      - ${TRIM_APPDEST}:/app/target
      # rainbow-scan-volumes-anchor 音乐库扫描目录挂载锚点：渲染时在本行后插入
      # - <宿主机目录>:/app/data/scan/N（幂等重建；v0.2.2 起锚点不用 __XXX__ 形式，避免被 fnOS 移除）
    # 内存上限保护：与 config.yaml 的 download.memLimitMB 联动，阈值应设为本上限的 ~83%（512m → 400）；
    # 若收紧本上限（如 384m/256m），需同步下调 memLimitMB（320/200），否则内核 OOM kill 会先于护栏生效
    mem_limit: 512m
