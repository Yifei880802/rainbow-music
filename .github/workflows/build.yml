# Rainbow 构建发布流水线
#
# 触发方式：
#   1. push tag vX.Y.Z[-rN]（正式发布）
#   2. workflow_dispatch 手动触发（输入 version，格式同上）
#
# 版本契约：
#   - tag = vX.Y.Z-rN（rN 为修订号；禁止 latest）
#   - 镜像 tag 与 fpk compose 中的 tag 严格一致
#   - scripts/build-fpk.sh 读取 FPK_VERSION / FPK_IMAGE / FPK_IMAGE_TAG / FPK_IMAGE_DIGEST，
#     产物输出至 dist-fpk/rainbow-${FPK_VERSION}.fpk
#   - digest pin：docker 作业把推送后的多架构 index digest 作为作业输出传给 fpk 作业，
#     fpk 内 compose 的 image 因此渲染为 <image>:<tag>@<digest>，发布产物被钉死在
#     CI 实际推送的那个 index 上；tag 事后被重推也不会让已发布的 fpk 拉到别的镜像。
#     digest 取不到时 docker 作业直接失败——静默退回纯 tag 引用等于悄悄撤销 pin
#   - fnpack 官方二进制在 fpk 作业中尝试下载（直链见下），以 FNPACK_BIN 注入
#     build-fpk.sh 走官方打包路径；下载失败不中断流水线，build-fpk.sh
#     自行降级为手工 tar 组装（与脚本既有降级语义一致）
#
# Job 依赖：meta → build → docker → fpk → release

name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号，格式 vX.Y.Z 或 vX.Y.Z-rN（如 v0.2.0-r1）'
        required: true
        type: string

permissions:
  contents: write   # 创建 GitHub Release
  packages: write   # 推送 GHCR 镜像

jobs:
  # ─────────────────────────────────────────────
  # ① 解析版本号：全流水线共享同一份版本信息
  # ─────────────────────────────────────────────
  meta:
    name: 解析版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}     # X.Y.Z-rN（fpk 版本号，不带 v）
      image_tag: ${{ steps.calc.outputs.image_tag }} # vX.Y.Z-rN（镜像 tag，禁止 latest）
      image: ${{ steps.calc.outputs.image }}         # ghcr.io/<owner>/rainbow-music（全小写）
    steps:
      - name: 校验并推导版本号
        id: calc
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          REF="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          if ! [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-r[0-9]+)?$ ]]; then
            echo "::error::版本号不合法：${REF}（要求 vX.Y.Z 或 vX.Y.Z-rN）"
            exit 1
          fi
          OWNER_LC="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=${REF#v}"
            echo "image_tag=${REF}"
            echo "image=ghcr.io/${OWNER_LC}/rainbow-music"
          } >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────
  # ② typecheck + build（Node 20）
  # ─────────────────────────────────────────────
  build:
    name: Typecheck + 编译
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: 安装依赖并编译
        working-directory: server
        run: |
          npm ci
          npm run typecheck && npm run build

  # ─────────────────────────────────────────────
  # ③ Docker buildx 多架构镜像 → GHCR
  #    编译产物在镜像内重新生成（Dockerfile 多阶段构建），
  #    此 job 依赖 build 仅作为「编译门禁」
  # ─────────────────────────────────────────────
  docker:
    name: 构建 amd64+arm64 镜像并推送 GHCR
    needs: [meta, build]
    runs-on: ubuntu-latest
    outputs:
      # 多架构 index digest（不是单平台 digest），fpk 作业据此钉死 compose 的 image 引用
      image_digest: ${{ steps.push.outputs.image_digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送（amd64 + arm64）
        id: push
        env:
          IMAGE: ${{ needs.meta.outputs.image }}
          IMAGE_TAG: ${{ needs.meta.outputs.image_tag }}
        run: |
          set -euo pipefail
          META_JSON="$RUNNER_TEMP/buildx-meta.json"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Dockerfile \
            --tag "${IMAGE}:${IMAGE_TAG}" \
            --metadata-file "$META_JSON" \
            --push .
          # 多平台 push 下 containerimage.digest 即 index digest。这是 fpk 里 digest pin
          # 的唯一来源，取不到就必须让流水线红掉：静默退回纯 tag 引用等于悄悄撤销 pin，
          # 而且失败会一路带到已发布的 Release 上，事后极难发现。
          DIGEST="$(jq -r '."containerimage.digest" // ."containerimage.descriptor".digest // empty' "$META_JSON")"
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::未能从 buildx metadata 取得合法 index digest（实际得到：'${DIGEST}'），拒绝继续打包未钉死的 fpk"
            echo "--- buildx metadata 全文 ---"; cat "$META_JSON"
            exit 1
          fi
          echo "image_digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "[docker] 已推送 index digest = ${DIGEST}"

  # ─────────────────────────────────────────────
  # ④ 组装 .fpk（依赖镜像已推送：fpk compose 引用该 tag 并 pin 其 index digest）
  #    先尝试下载官方 fnpack（linux 直链）注入 FNPACK_BIN；
  #    下载失败不中断流水线，build-fpk.sh 内部走降级组装路径
  # ─────────────────────────────────────────────
  fpk:
    name: 打包 .fpk
    needs: [meta, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下载官方 fnpack（失败不中断，降级 tar 路径）
        run: |
          FNPACK_VER="1.2.3"
          # 飞牛官方直链命名约定：fnpack-<ver>-linux-<amd64|arm64>（已探测 linux-amd64 → HTTP 200）
          case "${RUNNER_ARCH:-X64}" in
            ARM64) ARCH_SUFFIX="arm64" ;;
            *)     ARCH_SUFFIX="amd64" ;;
          esac
          URL="https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VER}-linux-${ARCH_SUFFIX}"
          BIN="$RUNNER_TEMP/fnpack"
          echo "[fnpack] 下载官方二进制：${URL}"
          if curl -fSL --retry 3 --retry-delay 2 --connect-timeout 15 -o "$BIN" "$URL" \
             && [ -s "$BIN" ] && chmod +x "$BIN"; then
            echo "FNPACK_BIN=$BIN" >> "$GITHUB_ENV"
            echo "[fnpack] 下载成功，build-fpk.sh 将走官方 fnpack 打包路径（FNPACK_BIN=$BIN）"
          else
            echo "::warning::官方 fnpack 下载/校验失败（${URL}），不中断流水线：build-fpk.sh 将降级为手工 tar 组装（降级产物仅供本地验证，真机分发请使用 fnpack 构建）"
          fi
      - name: 运行 scripts/build-fpk.sh
        env:
          FPK_VERSION: ${{ needs.meta.outputs.version }}
          FPK_IMAGE: ${{ needs.meta.outputs.image }}
          FPK_IMAGE_TAG: ${{ needs.meta.outputs.image_tag }}
          FPK_IMAGE_DIGEST: ${{ needs.docker.outputs.image_digest }}
        run: |
          chmod +x scripts/build-fpk.sh
          scripts/build-fpk.sh
      - name: 校验产物
        env:
          FPK_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          ls -lh "dist-fpk/rainbow-${FPK_VERSION}.fpk"
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: rainbow-fpk
          path: dist-fpk/*.fpk
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # ⑤ 创建 GitHub Release：上传 .fpk + 自动生成变更清单
  # ─────────────────────────────────────────────
  release:
    name: 创建 GitHub Release
    needs: [meta, fpk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整 tag 历史以生成变更清单
      - name: 下载 .fpk 产物
        uses: actions/download-artifact@v4
        with:
          name: rainbow-fpk
          path: dist-fpk
      - name: 创建 Release（自动生成 Release Notes）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.meta.outputs.image_tag }}
        run: |
          set -euo pipefail
          # 找到上一个发布 tag 作为变更清单起点（首个版本则省略）
          PREV_TAG="$(git tag --list 'v*' --sort=-v:refname | grep -Fxv "${IMAGE_TAG}" | head -n 1 || true)"
          NOTES_ARGS=(--generate-notes)
          if [[ -n "${PREV_TAG}" ]]; then
            NOTES_ARGS+=(--notes-start-tag "${PREV_TAG}")
          fi
          gh release create "${IMAGE_TAG}" dist-fpk/*.fpk \
            --title "Rainbow ${IMAGE_TAG}" \
            "${NOTES_ARGS[@]}"
