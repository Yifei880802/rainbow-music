server:
  host: 0.0.0.0
  port: 23330

# ── 鉴权（v0.2.1 双模式，见 docs/FNOS-DEPLOY.md）──
# 端口直连（local 模式）：用 webLogin 的 admin 账密登录；
# fnOS 网关入口（gateway 模式）：由 fnOS 校验用户会话（FN ID 免密），
# 不经过本段账密，多用户身份由网关注入的可信头提供。
# 两入口并存：改这里的密码只影响端口直连/admin 登录。
auth:
  enabled: true
  apiKey: ""
  webLogin:
    username: admin
    password: admin

# ── 容器环境变量（fnOS .fpk 部署时由 compose 自动注入，无需也不应写进本文件）──
#   RO_GATEWAY_SOCK  统一网关 Unix Socket 路径（如 /app/target/app.sock）。
#                     设置后额外启动网关实例：采信 fnOS 注入的
#                     X-Trim-Userid/X-Trim-Username/X-Trim-Isadmin 身份头，
#                     并剥除 fnOS 网关保留转发的 /app/com.rainbow.music 前缀
#                     （v0.2.5）；注册 POST /api/v1/auth/gateway-login；
#                     未设置时仅 TCP 实例（v0.2.0 行为，对 X-Trim-* 头零采信，防伪造）
#   RO_SCAN_ROOTS    本地音乐库可选扫描根（":" 分隔容器内路径，如
#                     /app/data/downloads:/app/data/scan/1）。安装向导的
#                     「音乐库扫描目录」由生命周期脚本渲染进 compose；
#                     用户在前端「NAS 音乐」页勾选个人扫描根（存 SQLite，按 uid 隔离）

download:
  dir: data/downloads
  concurrency: 3
  defaultQuality: flac
  nameTemplate: "{name} - {singer}"
  embedCover: true
  embedLyric: true
  coverSize: 500
  # ── 性能加固项（全部可选，注释中为默认值；不配置时代码侧用默认值）──
  # autoConcurrency: true        # 自适应并发：并发数 = clamp(CPU核数, 2, 6)。
                                 # 注意：本文件显式写了上面的 concurrency 时，手动值优先于自适应；
                                 # 仅未配置 concurrency 时才按 CPU 核数自适应
  # retryMax: 3                  # 任务失败自动重试次数（指数退避，见 retryBaseDelayMs）
  # retryBaseDelayMs: 1000       # 重试退避基础延迟：第 1/2/3 次重试前分别等待 1s/2s/4s
  # progressFlushIntervalMs: 500 # 进度落盘节流：时间阈值（ms）
  # progressFlushPercentStep: 2  # 进度落盘节流：百分比阈值（%）
  #   行为语义：SSE 仍每 chunk 实时推进度；SQLite 按上述双阈值合并写入，
  #   任务完成/失败/取消时强制落盘最后进度，重启后进度不回退
  # memGuardIntervalMs: 5000     # RSS 内存护栏采样周期（ms）
  # memLimitMB: 400              # RSS 超过该阈值（MB）暂停出队，回落 10% 后自动恢复
                                 # 阈值应低于容器内存上限（经验值 ~83%）：
                                 # 容器 512m → 400、384m → 320、256m → 200；
                                 # 高于上限时内核 OOM kill 会先于护栏生效（护栏形同虚设）
  # batchActivationSize: 200     # 批量入队背压：内存中同时激活的任务上限，超量分批激活
  # tagWorkers: 2                # 元数据嵌入 worker 数，默认 clamp(floor(CPU/2), 1, 2)，上限 4
  # ── P0 下载数据安全 + 真实音质回写（全部可选，注释中为默认值）──
  # onConflict: suffix           # 同名文件冲突策略：suffix(追加 (1)(2)…) | overwrite(覆盖) | skip(跳过)
  # verifyIntegrity: true        # 下载完整性校验：比对 received vs content-length，不一致记 warning
  # detectRealQuality: true      # 下载完成后用 music-metadata 读取真实码率/编码/采样率
  # ── P1 下载引擎强化（全部可选，注释中为默认值）──
  # dirTemplate: ""              # 落盘子目录模板（G1）：''=平铺；支持 '{singer}/{album}'、
  #                              # '{singerFirstLetter}/{singer}'；占位符同 nameTemplate，逐段消毒
  # dedupePolicy: skip           # 入队去重策略（H5）：skip(命中复用既有任务) |
  #                              # replace(取消在途重复项后新建) | always-new(永不去重)
  # batchMaxItems: 200           # 批量入队单次上限（H1/H5）
  # resume: true                 # 断点续传（F2）：失败/重启后按 Range 续下，临时名 .tmp-{taskId}
  # ── P2 性能细项（N3，全部可选，注释中为默认值）──
  # diskPrecheck: true           # 入队前磁盘空间预检：可用空间不足 minFreeBytes 时拒绝入队（HTTP 507 + ERR_DISK_FULL）
  # minFreeBytes: 104857600      # 最小可用磁盘字节数，默认 100MB（104857600）
sources:
  dir: data/sources
  hotReload: true
  # ── P2 音源健康编排与限速（L1/L2/L3，全部可选，注释中为默认值）──
  # healthAware: true            # L1: 按 smoke_results 近 N 次成功率对候选音源排序（全失败源降权）
  # circuitThreshold: 5          # L2: 同一音源窗口内连续失败 ≥K 次即熔断临时剔除（避免每任务白跑 30s）
  # circuitWindowMs: 300000      # L2: 熔断统计滑动窗口（ms），默认 5 分钟
  # ratePerMin: 0                # L3: 每音源每分钟 callAction 上限（0=不限速），与全局 rateLimit 协同防打爆上游风控
# ── P0 搜索基础设施（全部可选；未配置时代码侧用默认值）──
# 控制聚合搜索的超时/内存缓存，以及联想(suggest)与热搜(trending)端点。
search:
  timeoutMs: 8000          # /search/aggregate 单次聚合整体超时（ms），超时平台进 errors 不阻塞其余
  cacheTtlMs: 300000       # 聚合/联想结果服务端内存缓存 TTL（ms），默认 5 分钟
  defaultLimit: 30         # 各平台搜索默认返回条数（统一 tx/mg 原 50/20 为 30）
  # ── P1 搜索后端 J（#191，全部可选；注释中为默认值）──
  # platformWeights:       # J2 本地相关度评分的平台权重（乘数，作用于文本/音质/时长得分）
  #   kw: 1
  #   kg: 1
  #   tx: 1.1              # QQ 音乐曲库全、音质高，略加权
  #   wy: 1
  #   mg: 0.9              # 咪咕音质/匹配略弱，略降权
  # suggestPlatforms: [wy, tx, kg]  # D2 联想标题池取榜平台（仅这几个榜的歌曲名进入联想候选）
  # ── P2 搜索高阶 O4/O5（#200，全部可选；注释中为默认值）──
  # correctEnabled: true     # O4 错字容错：聚合结果过少时返回纠错建议（不自动替换用户原词，仅供前端「已为你搜索 X」提示）
  # correctMinResults: 3     # O4 触发阈值：聚合结果条数 < 此值时尝试编辑距离≤1 纠错（词典取历史成功搜索词）
  # relatedEnabled: true     # O5 相关推荐：/search/related 基于搜索历史共现推荐「搜过 X 的人也搜 Y」；冷启动回退 trending
# ── #45 自动刮削（全部可选；未配置时代码侧用默认值）──
# 下载完成后自动回查平台详情（年份/曲目号/流派/碟号/专辑艺术家），
# read-merge-write 只补缺不覆盖已嵌入的标签；失败只记内部状态、不影响下载。
scrape:
  enabled: true         # 总开关（false 时零行为变化）
  # autoOnComplete: true  # 下载完成后自动刮削（关闭后仅设置页手动触发）
  # concurrency: 1        # 刮削并发（1-4，后台任务建议保持 1）
  # timeoutMs: 8000       # 平台详情接口超时（ms）
  # retryMax: 2           # failed 自动重试上限（间隔 5s/15s）
  # overwrite: false      # true 时覆盖已有标签字段（默认只补缺）
rateLimit:
  enabled: true
  windowMs: 60000
  max: 300
smokeTest:
  enabled: true
  cron: 0 6 * * *
  keyword: 周杰伦
  checkLyric: true
  checkPic: true
  alertThreshold: 2
  alert:
    bark:
      enabled: false
      serverUrl: https://api.day.app
      deviceKey: ""
    serverChan:
      enabled: false
      sendKey: ""
log:
  level: info
