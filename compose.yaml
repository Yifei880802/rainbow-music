services:
  rainbow:
    build:
      context: .
      dockerfile: Dockerfile
    image: rainbow-music:latest
    container_name: rainbow
    restart: unless-stopped
    ports:
      - "23330:23330"
    environment:
      TZ: Asia/Shanghai
      RO_SERVER_HOST: 0.0.0.0
      RO_SERVER_PORT: "23330"
    volumes:
      # 配置文件（用户名/密码/apiKey/各项设置都在这里）→ 映射到宿主机，改完重启容器即生效
      - ./config.yaml:/app/config.yaml
      # 下载目录 → 宿主机，下载的音乐文件直接落到这里
      - ./data/downloads:/app/data/downloads
      # 音源目录 → 宿主机，放 lx-music 音源脚本(.js)
      - ./data/sources:/app/data/sources
      # SQLite 数据库目录（任务记录/歌单，含 ro.db + -wal/-shm）→ 宿主机，容器重建不丢历史
      - ./data/db:/app/data/db
    # 内存上限保护（个人自用，实测峰值 <200MB，这里留足余量）
    # 与 config.yaml 的 download.memLimitMB 联动：阈值应设为本上限的 ~83%（512m → 400）；
    # 若收紧本上限（如 384m/256m），需同步下调 memLimitMB（320/200），否则内核 OOM kill 会先于护栏生效
    mem_limit: 512m
