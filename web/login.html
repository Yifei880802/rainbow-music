<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Rainbow Music 彩虹音乐 — 跨平台聚合搜索、无损音乐下载与本地曲库管理" />
  <title>登录 · Rainbow Music 彩虹音乐</title>
  <!-- v0.2.5 网关适配：资源引用改相对路径（iframe 前缀/直连根两态通吃，见 index.html 注释） -->
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-body">
  <!-- v0.2.1 模块六：FN ID 网关模式直达（mode='gateway' 时由 login.js 隐藏账密表单并
       展示本卡：飞牛 NAS 已登录 → 「已通过飞牛账号登录为 {username}」+ 进入 Rainbow
       （POST /api/v1/auth/gateway-login）；未登录 → 提示先登录飞牛；local 模式零变化）
       gw-*/login-gw-* 新命名空间，契约 A/B 未涉及登录页结构 -->
  <div id="login-gateway" class="login-gw" hidden>
    <div class="login-gw-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5.5A1.5 1.5 0 0 1 4.5 4h4l2 2.5h7A1.5 1.5 0 0 1 19 8v1"/><path d="M3 9h17.2a1 1 0 0 1 .98 1.2l-1.5 7A1.6 1.6 0 0 1 18.1 18.4H5.4a1.6 1.6 0 0 1-1.57-1.28L2.2 10.2A1 1 0 0 1 3 9z"/><path d="M12 12.5v3M10.4 14h3.2" transform="translate(0 -.5)"/></svg>
    </div>
    <h2 class="login-gw-title">飞牛账号</h2>
    <p class="login-gw-text" id="login-gw-text"></p>
    <button type="button" id="login-gw-btn" class="login-gw-btn" hidden>进入 Rainbow</button>
  </div>
  <form id="login-form" class="login-card">
    <h1>🌈 Rainbow Music</h1>
    <p class="login-sub">请登录以继续</p>
    <div id="login-hint" class="login-hint" hidden></div>
    <input type="text" id="login-user" placeholder="用户名" autocomplete="username" required />
    <input type="password" id="login-pass" placeholder="密码" autocomplete="current-password" required />
    <button type="submit" id="login-btn">登录</button>
    <div id="login-err" class="login-err" hidden></div>
  </form>
  <div class="login-deco" aria-hidden="true">
    <span class="login-chip"><i></i>FLAC 无损</span>
    <span class="login-chip"><i></i>Hi-Res 24bit</span>
    <span class="login-chip"><i></i>全平台聚合</span>
  </div>
  <script src="login.js"></script>
</body>
</html>
